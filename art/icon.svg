<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2a2433"/>
      <stop offset="1" stop-color="#0d0b12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#e0b04a"/>
      <stop offset="1" stop-color="#9a6a22"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="0.5" stop-color="#a8792a"/>
      <stop offset="1" stop-color="#e8c066"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background tile with gold border -->
  <rect x="16" y="16" width="480" height="480" rx="72" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="72" fill="none" stroke="url(#border)" stroke-width="14"/>

  <!-- "Nearby" rings under the pin -->
  <ellipse cx="256" cy="430" rx="128" ry="30" fill="none" stroke="#e0b04a" stroke-opacity="0.28" stroke-width="8"/>
  <ellipse cx="256" cy="430" rx="70" ry="16" fill="none" stroke="#e0b04a" stroke-opacity="0.6" stroke-width="8"/>

  <!-- Map pin -->
  <path filter="url(#shadow)" fill="url(#gold)" stroke="#5a3d12" stroke-width="6"
        d="M256 436 C200 362 132 300 132 212 A124 124 0 1 1 380 212 C380 300 312 362 256 436 Z"/>

  <!-- Quest exclamation mark -->
  <rect x="236" y="128" width="40" height="112" rx="20" fill="#1c140b"/>
  <circle cx="256" cy="282" r="22" fill="#1c140b"/>
</svg>
